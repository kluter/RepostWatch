  ats: ashby
  board: iceye
  name: ICEYE
  website: https://www.iceye.com
  facts:
    Founded: "2014"
    HQ: Espoo, Finland
    Industry: SAR Earth-observation satellites
  partners:
    - Rheinmetall (JV)
    - SpaceX (launch)

