# One entry per tracked company. Adding a company is a config change, not a code change.
#   slug:   directory name under data/
#   ats:    adapter to use (ashby | greenhouse | recruitee | personio | teamtailor | workable | lever)
#   board:  board identifier in the ATS public feed URL:
#             ashby      -> job-board name          (api.ashbyhq.com/.../{board})
#             greenhouse -> board token             (boards-api.greenhouse.io/.../{board}/jobs)
#             recruitee  -> subdomain               ({board}.recruitee.com/api/offers/)
#             personio   -> subdomain               ({board}.jobs.personio.de/xml)
#             teamtailor -> careers host            (https://{board}/jobs.rss)
#             workable   -> account slug            (apply.workable.com/api/v1/widget/accounts/{board})
#             lever      -> account slug            (api.lever.co/v0/postings/{board})
#   name / website / facts / partners: shown in the dashboard sidebar (all optional).
#   logo:   only needed for a non-default file; assets/companies/{slug}.png is picked up automatically.
#           Logos should be dark-on-transparent (they are inverted to white on the dark panel).
#   logo_invert: false keeps a coloured logo's hue instead of inverting it (just brightened).
